# goss spec - chiomab/xpass:v1.4 internal dependency validation (serves XPASS + XPASS+)
file:
  /usr/local/bin/xpass-help:
    exists: true
    mode: "0755"
    filetype: file
  /usr/local/bin/run_xpass.R:
    exists: true
    filetype: file
  /usr/local/bin/plink:
    exists: true
    filetype: file
  /usr/local/bin/goss:
    exists: true
    mode: "0755"
    filetype: file

command:
  "R --version":
    exit-status: 0
    stdout:
      - "4.1.2"
  # XPASS + all deps the runner needs (incl. ieugwasr for XPASS+ clumping) load cleanly
  "R -q -e 'suppressMessages({library(XPASS); library(data.table); library(RhpcBLASctl); library(ieugwasr)})'":
    exit-status: 0
  # plink 1.9 present (used by XPASS+ clumping)
  "/usr/local/bin/plink --version":
    exit-status: 0
  # bundled usage helper runs and prints the tool banner
  "/usr/local/bin/xpass-help":
    exit-status: 0
    stdout:
      - "XPASS"
      - "YangLabHKUST/XPASS"
